[workspace]
resolver = "2"
members = [
    "crates/plinth-geom",
    "crates/plinth-model",
    "crates/plinth-views",
    "crates/plinth-ifc",
    "crates/plinth-app",
]
default-members = ["crates/plinth-app"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/dsalesarchitect/arch3d"
rust-version = "1.81"
authors = ["David Sales <dsalesarchitect@gmail.com>", "Arch3D Contributors"]

[workspace.dependencies]
# Internal crates
plinth-geom = { path = "crates/plinth-geom" }
plinth-model = { path = "crates/plinth-model" }
plinth-views = { path = "crates/plinth-views" }
plinth-ifc = { path = "crates/plinth-ifc" }

# External crates (keep this list short and well-maintained)
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "=1.10.0", features = ["v4", "serde", "js"] }
getrandom = { version = "0.2", features = ["js"] }
eframe = "0.31.1"
egui = "0.31.1"
rfd = "0.15"
log = "0.4"
env_logger = "0.11"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 4
