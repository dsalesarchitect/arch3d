name: Build & Publish Arch3D Release (with SHA-256)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag (e.g. v0.2.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  build-windows-release:
    name: Build Windows x86_64 Release & SHA-256
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Rust Stable
        uses: dtolnay/rust-toolchain@stable

      - name: Run All Workspace Tests
        run: cargo test --workspace

      - name: Build Release Binary (arch3d.exe)
        run: cargo build --release --bin arch3d

      - name: Package ZIP & Generate SHA-256 Checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          Copy-Item target\release\arch3d.exe dist\arch3d.exe
          Compress-Archive -Path dist\arch3d.exe -DestinationPath dist\arch3d-windows-x86_64.zip -Force
          $exeHash = (Get-FileHash dist\arch3d.exe -Algorithm SHA256).Hash.ToLower()
          $zipHash = (Get-FileHash dist\arch3d-windows-x86_64.zip -Algorithm SHA256).Hash.ToLower()
          "$exeHash  arch3d.exe" | Out-File -Encoding ascii dist\SHA256SUMS.txt
          "$zipHash  arch3d-windows-x86_64.zip" | Out-File -Encoding ascii -Append dist\SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/arch3d.exe
            dist/arch3d-windows-x86_64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
